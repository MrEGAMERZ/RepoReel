name: 💡 Feature Request
description: Suggest an idea for RepoReel (new skill format, AI provider, etc.)
title: "feat: <short description>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a feature request! 
        *Note: If you want to add a new video format, you can easily do it by contributing a Markdown file to the `skills/` folder.*

  - type: textarea
    id: problem
    attributes:
      label: 💥 Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 🚀 Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: I want RepoReel to be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.

  - type: checkboxes
    id: implementation
    attributes:
      label: Would you be willing to submit a PR for this feature?
      description: We are an open-source project and heavily rely on community contributions.
      options:
        - label: Yes, I can help implement this!
