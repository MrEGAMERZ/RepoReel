name: 🐛 Bug Report
description: Report a bug to help us improve RepoReel
title: "bug: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        Before you submit, please search [existing issues](https://github.com/MrEGAMERZ/RepoReel/issues) to see if this has already been reported.

  - type: textarea
    id: description
    attributes:
      label: 🐛 Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I run `reproreel video --type product-hunt`, it fails with...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 Steps to reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Run `...`
        2. Enter `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 🎯 Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📋 Logs / Terminal Output
      description: Please paste any relevant error logs or terminal output here.
      render: shell

  - type: input
    id: environment
    attributes:
      label: 💻 Environment
      description: What OS, Node.js version, and RepoReel version are you using?
      placeholder: macOS 14.2 / Node 20.10 / RepoReel 0.1.0
    validations:
      required: true
